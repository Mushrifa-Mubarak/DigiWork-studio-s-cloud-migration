  # ============================================
  # CloudWatch Resources
  # ============================================
  # CloudWatch = Monitoring & alerting service
  # Watch infrastructure health, get notified if problems
  WebServerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/ec2/${EnvironmentName}/webserver'
      RetentionInDays: 7
            # Keep logs for 7 days (older logs deleted, saves cost)


  DatabaseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/rds/${EnvironmentName}/database'
      RetentionInDays: 7

  HighCPUAlarm:
        # Monitor CPU usage percentage

    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${EnvironmentName}-Web-Server-High-CPU'
      AlarmDescription: Alert when web server CPU exceeds 80%
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref WebServer
      TreatMissingData: notBreaching
            # Don't alarm if data is missing


  DatabaseCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${EnvironmentName}-RDS-High-CPU'
      AlarmDescription: Alert when RDS CPU exceeds 80%
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RDSInstance
      TreatMissingData: notBreaching

  DatabaseStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${EnvironmentName}-RDS-Low-Storage'
      AlarmDescription: Alert when RDS free storage is less than 2GB
      MetricName: FreeStorageSpace
      Namespace: AWS/RDS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2000000000
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RDSInstance
      TreatMissingData: notBreaching

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${EnvironmentName}-Infrastructure-Alerts'
      DisplayName: DigiWorks Infrastructure Alerts
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Alert-Topic'
              # SNS = Simple Notification Service = Send alerts (email, SMS, etc.)


# ============================================
# Outputs
# ============================================
Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub '${EnvironmentName}-VPC-ID'

  PublicSubnet1Id:
    Description: Public Subnet 1 ID
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub '${EnvironmentName}-Public-Subnet-1'

  PublicSubnet2Id:
    Description: Public Subnet 2 ID
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub '${EnvironmentName}-Public-Subnet-2'

  PrivateSubnet1Id:
    Description: Private Subnet 1 ID
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub '${EnvironmentName}-Private-Subnet-1'

  PrivateSubnet2Id:
    Description: Private Subnet 2 ID
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub '${EnvironmentName}-Private-Subnet-2'

  WebServerPublicIP:
    Description: Web Server Public IP Address
    Value: !GetAtt WebServer.PublicIp

  WebServerURL:
    Description: Web Server URL - Click to view deployment
    Value: !Sub 'http://${WebServer.PublicDnsName}'

  WebServerInstanceId:
    Description: Web Server Instance ID
    Value: !Ref WebServer
    Export:
      Name: !Sub '${EnvironmentName}-Web-Server-ID'

  RDSEndpoint:
    Description: RDS MySQL Database Endpoint
    Value: !GetAtt RDSInstance.Endpoint.Address
    Export:
      Name: !Sub '${EnvironmentName}-RDS-Endpoint'

  RDSPort:
    Description: RDS Database Port
    Value: !GetAtt RDSInstance.Endpoint.Port

  RDSConnectionString:
    Description: MySQL Connection String
    Value: !Sub 'mysql://${DBUsername}:****@${RDSInstance.Endpoint.Address}:${RDSInstance.Endpoint.Port}/digiworks'

  MediaBucketName:
    Description: S3 Media Storage Bucket Name
    Value: !Ref MediaStorageBucket
    Export:
      Name: !Sub '${EnvironmentName}-Media-Bucket'

  BackupBucketName:
    Description: S3 Backup Bucket Name
    Value: !Ref BackupBucket
    Export:
      Name: !Sub '${EnvironmentName}-Backup-Bucket'

  NATInstanceIP:
    Description: NAT Instance Elastic IP
    Value: !Ref NATInstanceEIP

  AlertTopicARN:
    Description: SNS Topic ARN for Infrastructure Alerts
    Value: !Ref AlertTopic
    Export:
      Name: !Sub '${EnvironmentName}-Alert-Topic-ARN'

  MigrationSummary:
    Description: 7R Migration Strategy Summary
    Value: |
      Rehost: Web Servers (Dell → EC2)
      Replatform: Database (HP → RDS), Storage (NAS → S3)
      Repurchase: Firewall (Cisco → Security Groups), Backup (Manual → AWS Backup)
      Retain: Active Directory, Exchange (Phase 2)